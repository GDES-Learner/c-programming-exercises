/* =========================================================
   rendering
   ========================================================= */
const stage      = document.getElementById('stage');
const chipsEl    = document.getElementById('chips');
const counterEl  = document.getElementById('counter');
const pbar       = document.getElementById('pbar');
const prevBtn    = document.getElementById('prevBtn');
const nextBtn    = document.getElementById('nextBtn');
const scrim      = document.getElementById('scrim');
const palGrid    = document.getElementById('palGrid');
const searchEl   = document.getElementById('search');

const KW = new Set('auto break case char const continue default do double else enum extern float for goto if int long register return short signed sizeof static struct switch typedef union unsigned void volatile while'.split(' '));
const pad = n => String(n).padStart(2,'0');
const DONE_KEY = 'c-exercises-1-done';
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]')); } catch(e) { done = new Set(); }

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function hl(src){
  const re = /(\/\*[\s\S]*?\*\/)|(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|('(?:[^'\\]|\\.)*')|(^[ \t]*#[ \t]*\w+)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_]\w*)/gm;
  let out = '', last = 0, m;
  while ((m = re.exec(src)) !== null) {
    out += esc(src.slice(last, m.index));
    const t = m[0];
    let cls = '';
    if (m[1] || m[2]) cls = 'cm';
    else if (m[3]) cls = 'st';
    else if (m[4]) cls = 'ch';
    else if (m[5]) cls = 'pp';
    else if (m[6]) cls = 'nu';
    else if (m[7]) cls = KW.has(t) ? 'kw' : '';
    out += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
    last = m.index + t.length;
  }
  out += esc(src.slice(last));
  return out;
}

function block([type, val]){
  if (type === 'p')   return '<p>' + val + '</p>';
  if (type === 'l')   return '<div class="label">' + val + '</div>';
  if (type === 'c')   return '<pre><code>' + hl(val) + '</code></pre>';
  if (type === 'o')   return '<pre class="out">' + esc(val).replace(/(Press any key to continue\.\.\.)/g,'<span class="dim">$1</span>') + '</pre>';
  if (type === 'img') return '<div class="figure"><img src="' + val + '" alt="diagram" loading="lazy"></div>';
  return '';
}

function render(i, dir){
  const d = DATA[i];
  const body = d.body.map(block).join('');
  stage.innerHTML = `
  <article class="card glass">
    <div class="card-top">
      <div class="meta">
        <span class="num">EX ${pad(d.n)}</span>
        <span class="sep"></span>
        <span class="cat">${d.cat}</span>
      </div>
      <h2 class="title"><span class="grad">${d.title}</span></h2>
    </div>
    <div class="card-body" id="cardBody">
      <div class="q">${body}</div>

      <div class="actions">
        <button class="btn" data-act="hint">
          <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.4.3.5.7.5 1.1V16h6v-1c0-.4.1-.8.5-1.1A6 6 0 0 0 12 3z"/></svg>
          Hint <span class="tag-zh">提示</span>
        </button>
        <button class="btn primary" data-act="ans">
          <svg viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5"/></svg>
          Answer <span class="tag-zh">答案</span>
        </button>
      </div>

      <div class="panel hint" id="hintPanel">
        <div class="inner"><div class="panel-card">
          <div class="panel-head"><div class="panel-title"><span class="dotw"></span>Hint · 提示</div></div>
          ${d.hint}
        </div></div>
      </div>

      <div class="panel ans" id="ansPanel">
        <div class="inner"><div class="panel-card">
          <div class="panel-head">
            <div class="panel-title"><span class="dotw"></span>Answer · 参考答案</div>
            <button class="copy" data-act="copy">Copy</button>
          </div>
          <pre><code id="solCode">${hl(d.sol)}</code></pre>
          <ul>${d.notes.map(x => '<li>' + x + '</li>').join('')}</ul>
        </div></div>
      </div>
    </div>
    <div class="card-foot">
      <button class="foot-btn" data-act="prev" ${i===0?'disabled':''}>
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg> Previous
      </button>
      <span class="foot-mid">${pad(d.n)} — ${DATA.length}</span>
      <button class="foot-btn" data-act="next" ${i===DATA.length-1?'disabled':''}>
        Next <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </article>`;

  const card = stage.firstElementChild;
  card.classList.add('anim');
  if (dir < 0) card.classList.add('back');

  card.addEventListener('pointermove', e => {
    const r = card.getBoundingClientRect();
    card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
    card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  });

  card.querySelector('#cardBody').scrollTop = 0;
}

/* panels */
function toggle(panel, btn){
  const open = panel.classList.toggle('open');
  btn.classList.toggle('on', open);
  if (!open) return;
  setTimeout(() => {
    const body = panel.closest('.card-body');
    if (!body) return;
    const r1 = body.getBoundingClientRect(), r2 = panel.getBoundingClientRect();
    body.scrollTo({ top: body.scrollTop + (r2.top - r1.top) - 16, behavior:'smooth' });
  }, 280);
}

/* state */
let cur = 0;
try {
  const saved = parseInt(localStorage.getItem('c-exercises-1-cur') || '0', 10);
  if (saved >= 0 && saved < DATA.length) cur = saved;
} catch(e) {}

/* deep link: Exercises.html#12  (also ?n=12 when hosted) */
try {
  let qn = parseInt((location.hash || '').replace(/[^\d]/g, ''), 10);
  if (!qn) qn = parseInt(new URLSearchParams(location.search).get('n') || '', 10);
  if (qn >= 1 && qn <= DATA.length) cur = qn - 1;
} catch(e) {}

function paintChrome(){
  counterEl.textContent = pad(cur+1) + ' / ' + DATA.length;
  pbar.style.width = ((cur+1) / DATA.length * 100) + '%';
  [...chipsEl.children].forEach((c, i) => {
    c.classList.toggle('on', i === cur);
    c.classList.toggle('done', done.has(i+1));
  });
  const active = chipsEl.children[cur];
  if (active) active.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === DATA.length - 1;
  try { localStorage.setItem('c-exercises-1-cur', cur); } catch(e) {}
}

function go(i, dir){
  if (i < 0 || i >= DATA.length) return;
  const d = dir !== undefined ? dir : (i > cur ? 1 : -1);
  cur = i;
  render(cur, d);
  paintChrome();
  buildPalette(searchEl.value);
}

/* chips */
DATA.forEach((d, i) => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = d.n;
  b.title = 'Exercise ' + d.n + ' · ' + d.title;
  b.addEventListener('click', () => go(i));
  chipsEl.appendChild(b);
});

/* palette */
function buildPalette(q){
  const key = (q || '').trim().toLowerCase();
  const list = DATA.filter(d =>
    !key || String(d.n) === key ||
    d.title.toLowerCase().includes(key) ||
    d.cat.toLowerCase().includes(key)
  );
  palGrid.innerHTML = list.length ? list.map(d => `
    <button class="tile ${d.n-1===cur?'on':''}" data-i="${d.n-1}">
      <span class="tn">${pad(d.n)}</span>
      <span class="tw"><span class="tt">${d.title}</span><span class="tc">${d.cat}</span></span>
    </button>`).join('') : '<div class="empty">No exercise matches “' + esc(q) + '”.</div>';
}

function openPalette(){
  buildPalette('');
  scrim.classList.add('open');
  setTimeout(() => searchEl.focus(), 120);
}
function closePalette(){
  scrim.classList.remove('open');
  searchEl.value = '';
  buildPalette('');
}

/* events */
document.getElementById('openPalette').addEventListener('click', openPalette);
prevBtn.addEventListener('click', () => go(cur - 1, -1));
nextBtn.addEventListener('click', () => go(cur + 1, 1));
scrim.addEventListener('click', e => { if (e.target === scrim) closePalette(); });
searchEl.addEventListener('input', e => buildPalette(e.target.value));
palGrid.addEventListener('click', e => {
  const t = e.target.closest('.tile');
  if (!t) return;
  go(parseInt(t.dataset.i, 10));
  closePalette();
});

stage.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'hint') toggle(document.getElementById('hintPanel'), b);
  if (act === 'ans') {
    toggle(document.getElementById('ansPanel'), b);
    if (!done.has(cur+1)) {
      done.add(cur+1);
      try { localStorage.setItem(DONE_KEY, JSON.stringify([...done])); } catch(err) {}
      paintChrome();
    }
  }
  if (act === 'copy') {
    const code = DATA[cur].sol;
    navigator.clipboard.writeText(code).then(() => {
      b.textContent = 'Copied';
      b.classList.add('ok');
      setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('ok'); }, 1400);
    }).catch(() => {});
  }
  if (act === 'prev') go(cur - 1, -1);
  if (act === 'next') go(cur + 1, 1);
});

document.addEventListener('keydown', e => {
  const typing = e.target.tagName === 'INPUT';
  if (e.key === 'Escape' && scrim.classList.contains('open')) { closePalette(); return; }
  if (typing) return;
  if (e.key === '/') { e.preventDefault(); openPalette(); return; }
  if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1, 1); }
  if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   { e.preventDefault(); go(cur - 1, -1); }
  if (e.key === 'h' || e.key === 'H') {
    const p = document.getElementById('hintPanel'), b = stage.querySelector('[data-act="hint"]');
    if (p) toggle(p, b);
  }
  if (e.key === 'a' || e.key === 'A') {
    const p = document.getElementById('ansPanel'), b = stage.querySelector('[data-act="ans"]');
    if (p) { toggle(p, b); done.add(cur+1); try { localStorage.setItem(DONE_KEY, JSON.stringify([...done])); } catch(err) {} paintChrome(); }
  }
});

/* boot */
render(cur, 1);
paintChrome();
buildPalette('');
</script>
</body>
</html>
